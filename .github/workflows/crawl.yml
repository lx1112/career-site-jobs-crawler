# Reads every company job board in boards.json and uploads the open jobs to Career Site Jobs Search.
# Twice a day because GitHub sometimes skips scheduled runs; ~28k boards take about 1.5–2 hours
# (Workable is paced at ~1.4 requests a second).
name: crawl

on:
  schedule:
    - cron: "23 4 * * *"
    - cron: "23 16 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: crawl
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Crawl and upload
        run: node crawler.mjs boards.json --prune
        env:
          JOBS_UPLOAD_URL: https://onchaincheck.dev/internal/jobs
          JOBS_SECRET: ${{ secrets.JOBS_SECRET }}
      - name: Commit the pruned directory
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add boards.json gone.json
          git diff --cached --quiet || git commit -m "Drop boards that no longer exist"
          git push
